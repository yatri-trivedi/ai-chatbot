<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Chat</title>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0d0d0f;
      --surface: #17171a;
      --surface2: #1f1f24;
      --border: rgba(255,255,255,0.07);
      --border2: rgba(255,255,255,0.12);
      --text: #f0eee8;
      --muted: #888680;
      --accent: #7f77dd;
      --accent-soft: rgba(127,119,221,0.15);
      --accent-glow: rgba(127,119,221,0.25);
      --user-bg: #534ab7;
      --user-text: #eeedfe;
      --bot-bg: #1f1f24;
      --font: 'Sora', sans-serif;
      --mono: 'JetBrains Mono', monospace;
      --radius: 18px;
      --radius-sm: 10px;
    }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Header */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem 1.5rem;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      flex-shrink: 0;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-icon {
      width: 32px;
      height: 32px;
      background: var(--accent);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
    }

    .logo-text {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    .logo-text span {
      color: var(--accent);
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background: #63dd63;
      border-radius: 50%;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    .status-text {
      font-size: 12px;
      color: var(--muted);
      font-weight: 500;
    }

    .new-chat-btn {
      background: var(--surface2);
      border: 1px solid var(--border2);
      color: var(--text);
      font-family: var(--font);
      font-size: 12px;
      font-weight: 500;
      padding: 6px 14px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.15s;
    }

    .new-chat-btn:hover {
      background: var(--accent-soft);
      border-color: var(--accent);
      color: var(--accent);
    }

    /* Model badge */
    .model-badge {
      font-family: var(--mono);
      font-size: 11px;
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 4px 10px;
      border-radius: 20px;
    }

    /* Messages area */
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 2rem 1rem;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
      scroll-behavior: smooth;
    }

    #messages::-webkit-scrollbar { width: 4px; }
    #messages::-webkit-scrollbar-track { background: transparent; }
    #messages::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 4px; }

    /* Welcome screen */
    .welcome {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      padding: 2rem;
      text-align: center;
    }

    .welcome-icon {
      width: 56px;
      height: 56px;
      background: var(--accent-soft);
      border: 1px solid var(--accent);
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      margin-bottom: 0.5rem;
    }

    .welcome h2 {
      font-size: 22px;
      font-weight: 600;
      letter-spacing: -0.03em;
    }

    .welcome p {
      font-size: 14px;
      color: var(--muted);
      max-width: 320px;
      line-height: 1.6;
    }

    .suggestions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin-top: 0.5rem;
    }

    .suggestion-chip {
      background: var(--surface2);
      border: 1px solid var(--border2);
      color: var(--text);
      font-family: var(--font);
      font-size: 13px;
      padding: 8px 16px;
      border-radius: 20px;
      cursor: pointer;
      transition: all 0.15s;
    }

    .suggestion-chip:hover {
      border-color: var(--accent);
      color: var(--accent);
      background: var(--accent-soft);
    }

    /* Message row */
    .msg-row {
      display: flex;
      gap: 12px;
      max-width: 780px;
      width: 100%;
      margin: 0 auto;
      animation: fadeUp 0.2s ease;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .msg-row.user { flex-direction: row-reverse; }

    .avatar {
      width: 32px;
      height: 32px;
      border-radius: 10px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 600;
    }

    .avatar.bot {
      background: var(--accent-soft);
      border: 1px solid var(--accent);
      color: var(--accent);
    }

    .avatar.user {
      background: var(--user-bg);
      color: var(--user-text);
    }

    .bubble {
      padding: 12px 16px;
      border-radius: var(--radius);
      font-size: 14px;
      line-height: 1.7;
      max-width: calc(100% - 44px);
    }

    .bubble.bot {
      background: var(--bot-bg);
      border: 1px solid var(--border);
      border-top-left-radius: 4px;
      color: var(--text);
    }

    .bubble.user {
      background: var(--user-bg);
      color: var(--user-text);
      border-top-right-radius: 4px;
    }

    /* Typing indicator */
    .typing-dots {
      display: flex;
      gap: 4px;
      align-items: center;
      padding: 4px 0;
    }

    .typing-dots span {
      width: 6px;
      height: 6px;
      background: var(--muted);
      border-radius: 50%;
      animation: bounce 1.2s infinite;
    }

    .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
    .typing-dots span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); }
      30%           { transform: translateY(-5px); }
    }

    /* Input area */
    .input-area {
      padding: 1rem 1.5rem 1.5rem;
      border-top: 1px solid var(--border);
      background: var(--surface);
      flex-shrink: 0;
    }

    .input-wrap {
      max-width: 780px;
      margin: 0 auto;
      background: var(--surface2);
      border: 1px solid var(--border2);
      border-radius: 14px;
      display: flex;
      align-items: flex-end;
      gap: 8px;
      padding: 10px 10px 10px 16px;
      transition: border-color 0.2s;
    }

    .input-wrap:focus-within {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    #userInput {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font-family: var(--font);
      font-size: 14px;
      resize: none;
      max-height: 140px;
      line-height: 1.6;
      padding: 2px 0;
    }

    #userInput::placeholder { color: var(--muted); }

    #sendBtn {
      width: 36px;
      height: 36px;
      background: var(--accent);
      border: none;
      border-radius: 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: all 0.15s;
    }

    #sendBtn:hover { opacity: 0.85; transform: scale(1.05); }
    #sendBtn:active { transform: scale(0.97); }
    #sendBtn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

    #sendBtn svg { width: 16px; height: 16px; fill: white; }

    .input-footer {
      max-width: 780px;
      margin: 8px auto 0;
      font-size: 11px;
      color: var(--muted);
      text-align: center;
    }

    /* Markdown rendering inside bot bubble */
    .bubble.bot p { margin-bottom: 0.6em; }
    .bubble.bot p:last-child { margin-bottom: 0; }
    .bubble.bot ul, .bubble.bot ol { padding-left: 1.4em; margin-bottom: 0.6em; }
    .bubble.bot li { margin-bottom: 0.25em; }
    .bubble.bot h1,.bubble.bot h2,.bubble.bot h3 { font-weight: 600; margin: 0.8em 0 0.4em; letter-spacing: -0.02em; }
    .bubble.bot h1 { font-size: 16px; }
    .bubble.bot h2 { font-size: 15px; }
    .bubble.bot h3 { font-size: 14px; }
    .bubble.bot strong { font-weight: 600; color: #d8d4ff; }
    .bubble.bot em { font-style: italic; color: var(--muted); }
    .bubble.bot code {
      font-family: var(--mono);
      font-size: 12px;
      background: rgba(127,119,221,0.15);
      border: 1px solid rgba(127,119,221,0.25);
      padding: 1px 6px;
      border-radius: 5px;
      color: #c4bfff;
    }
    .bubble.bot pre {
      background: #0d0d0f;
      border: 1px solid var(--border2);
      border-radius: 10px;
      padding: 14px 16px;
      overflow-x: auto;
      margin: 0.8em 0;
    }
    .bubble.bot pre code {
      background: none;
      border: none;
      padding: 0;
      font-size: 12.5px;
      color: #c4bfff;
      line-height: 1.6;
    }
    .bubble.bot a { color: var(--accent); text-decoration: underline; }
    .bubble.bot blockquote {
      border-left: 3px solid var(--accent);
      padding-left: 12px;
      color: var(--muted);
      margin: 0.6em 0;
    }
    .bubble.bot hr { border: none; border-top: 1px solid var(--border); margin: 0.8em 0; }
    .error-bubble {
      background: rgba(226, 75, 74, 0.1);
      border: 1px solid rgba(226, 75, 74, 0.3);
      color: #f09595;
      padding: 10px 16px;
      border-radius: 10px;
      font-size: 13px;
      max-width: 780px;
      margin: 0 auto;
    }
  </style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-icon">✦</div>
    <div class="logo-text">Groq<span>Chat</span></div>
  </div>
  <div class="header-right">
    <span class="model-badge">llama-3.1-8b-instant</span>
    <div class="status-dot"></div>
    <span class="status-text">Live</span>
    <button class="new-chat-btn" onclick="newChat()">+ New chat</button>
  </div>
</header>

<div id="messages">
  <div class="welcome" id="welcome">
    <div class="welcome-icon">✦</div>
    <h2>What can I help you with?</h2>
    <p>Powered by Llama 3.1 via Groq — fast, free, and ready to chat.</p>
    <div class="suggestions">
      <button class="suggestion-chip" onclick="sendSuggestion(this)">Explain quantum computing</button>
      <button class="suggestion-chip" onclick="sendSuggestion(this)">Write a Python script</button>
      <button class="suggestion-chip" onclick="sendSuggestion(this)">Plan a trip to Japan</button>
      <button class="suggestion-chip" onclick="sendSuggestion(this)">Summarize a topic</button>
    </div>
  </div>
</div>

<div class="input-area">
  <div class="input-wrap">
    <textarea id="userInput" rows="1" placeholder="Type a message…"></textarea>
    <button id="sendBtn" onclick="sendMessage()" title="Send">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
      </svg>
    </button>
  </div>
  <p class="input-footer">GroqChat may make mistakes. Verify important info.</p>
</div>

<script>
  const API = 'https://ai-chatbot-dsas.onrender.com';
  let sessionId = null;
  let isLoading = false;

  const messagesEl = document.getElementById('messages');
  const inputEl    = document.getElementById('userInput');
  const sendBtn    = document.getElementById('sendBtn');
  const welcomeEl  = document.getElementById('welcome');

  // Auto-resize textarea
  inputEl.addEventListener('input', () => {
    inputEl.style.height = 'auto';
    inputEl.style.height = Math.min(inputEl.scrollHeight, 140) + 'px';
  });

  // Send on Enter (Shift+Enter for newline)
  inputEl.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  });

  function sendSuggestion(btn) {
    inputEl.value = btn.textContent;
    sendMessage();
  }

  function newChat() {
    sessionId = null;
    messagesEl.innerHTML = '';
    messagesEl.appendChild(welcomeEl);
    welcomeEl.style.display = 'flex';
  }

  function appendMessage(role, text) {
    if (welcomeEl.style.display !== 'none') welcomeEl.style.display = 'none';

    const row = document.createElement('div');
    row.className = `msg-row ${role}`;

    const avatar = document.createElement('div');
    avatar.className = `avatar ${role}`;
    avatar.textContent = role === 'user' ? 'Y' : '✦';

    const bubble = document.createElement('div');
    bubble.className = `bubble ${role}`;
    if (role === 'bot') {
      bubble.innerHTML = marked.parse(text);
    } else {
      bubble.textContent = text;
    }

    row.appendChild(avatar);
    row.appendChild(bubble);
    messagesEl.appendChild(row);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return bubble;
  }

  function showTyping() {
    const row = document.createElement('div');
    row.className = 'msg-row bot';
    row.id = 'typing-row';

    const avatar = document.createElement('div');
    avatar.className = 'avatar bot';
    avatar.textContent = '✦';

    const bubble = document.createElement('div');
    bubble.className = 'bubble bot';
    bubble.innerHTML = '<div class="typing-dots"><span></span><span></span><span></span></div>';

    row.appendChild(avatar);
    row.appendChild(bubble);
    messagesEl.appendChild(row);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function removeTyping() {
    const el = document.getElementById('typing-row');
    if (el) el.remove();
  }

  function showError(msg) {
    const div = document.createElement('div');
    div.className = 'error-bubble';
    div.textContent = '⚠ ' + msg;
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    setTimeout(() => div.remove(), 5000);
  }

  async function sendMessage() {
    const text = inputEl.value.trim();
    if (!text || isLoading) return;

    isLoading = true;
    sendBtn.disabled = true;
    inputEl.value = '';
    inputEl.style.height = 'auto';

    appendMessage('user', text);
    showTyping();

    try {
      const res = await fetch(`${API}/chat`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text, session_id: sessionId })
      });

      const data = await res.json();

      if (!res.ok) {
        removeTyping();
        showError(data.detail || 'Something went wrong.');
        return;
      }

      sessionId = data.session_id;
      removeTyping();
      appendMessage('bot', data.reply);

    } catch (err) {
      removeTyping();
      showError('Could not reach the server. Is uvicorn running on port 8000?');
    } finally {
      isLoading = false;
      sendBtn.disabled = false;
      inputEl.focus();
    }
  }
</script>
</body>
</html>
